<!DOCTYPE html>
<html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misteri Tayammum 3D</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#0b2441;color:#fff;overflow:hidden}#scene{position:fixed;inset:0}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:10px;pointer-events:none} .panel{background:#092943dc;border:2px solid #a4e8ed;border-radius:15px;padding:10px 15px;box-shadow:0 4px 20px #0005}.panel small{display:block;color:#b8efff}#mission{max-width:410px}#hint{position:fixed;bottom:100px;left:50%;transform:translateX(-50%);background:#102d45e8;padding:10px 20px;border-radius:30px;text-align:center;min-width:220px}#controls{position:fixed;bottom:14px;left:14px;display:grid;grid-template-columns:repeat(3,56px);gap:5px;touch-action:none}button{cursor:pointer;font:inherit;border:0;border-radius:11px;padding:12px;background:#f7ce57;color:#172d3c;font-weight:800}#controls button{width:56px;height:52px;background:#ffffffc9}#controls .empty{visibility:hidden}#action{position:fixed;bottom:27px;right:16px;background:#56e0ba}#modal{position:fixed;inset:0;background:#061522d9;display:flex;align-items:center;justify-content:center;padding:15px;z-index:10}#modal.hidden{display:none}.dialog{width:min(580px,100%);max-height:90vh;overflow:auto;background:#fff;color:#18354b;border-radius:22px;padding:25px;box-shadow:0 20px 65px #0008}.dialog h1,.dialog h2{margin-top:0;color:#087a83}.dialog p{line-height:1.5}.answers{display:grid;gap:9px;margin:15px 0}.answers button{text-align:left;background:#e8f3f6}.answers button:hover{background:#c9e9e7}.primary{background:#0b9d93;color:white}.status{font-weight:700;min-height:24px}.tag{display:inline-block;background:#e7f6e9;color:#236a40;padding:5px 10px;border-radius:20px;font-size:13px}.help{position:fixed;right:12px;top:92px;background:#fff;color:#18354b;padding:9px;border-radius:10px;font-size:12px;max-width:170px}#map{position:fixed;right:12px;top:170px;width:150px;height:120px;background:#ddf1e3df;border:2px solid white;border-radius:12px} @media(max-width:650px){#hud{font-size:12px}#mission{max-width:64vw}#map{width:110px;height:90px;top:165px}.help{display:none}#hint{bottom:90px;font-size:12px;width:70%}}
</style></head><body><div id="scene"></div><div id="hud"><div class="panel" id="mission"><b>🏫 Misteri Tayammum 3D</b><small id="objective">Misi 1: Siasat tempat wuduk</small></div><div class="panel"><b>⭐ <span id="score">0</span></b><small id="progress">0/3 misi</small></div></div><div class="help">Gerak: WASD / anak panah<br>Interaksi: E / butang AKSI<br>Putar kamera: automatik</div><canvas id="map" width="150" height="120"></canvas><div id="hint">Dekati tempat wuduk 🚰</div><div id="controls"><span class="empty"></span><button data-key="ArrowUp">▲</button><span class="empty"></span><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button></div><button id="action">💬 AKSI (E)</button><div id="modal"><div class="dialog" id="dialog"></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x94d6ff);scene.fog=new THREE.Fog(0x94d6ff,40,85);
const camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,130);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;document.getElementById('scene').appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x6d9b69,2.2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-15,30,10);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.78});const green=mat(0x86c67d),stone=mat(0xf4e6c9),dark=mat(0x354b65),white=mat(0xffffff),blue=mat(0x3479d0),skin=mat(0xe2a977),black=mat(0x202633);
function cube(w,h,d,x,y,z,m,shadow=true){const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=shadow;o.receiveShadow=true;scene.add(o);return o}function ball(r,x,y,z,m){const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}function cylinder(r,h,x,y,z,m){const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,12),m);o.position.set(x,y,z);o.castShadow=true;scene.add(o);return o}
cube(60,.3,60,0,-.2,0,green,false);cube(5,.06,48,0,0,0,stone,false);cube(42,.06,5,0,0,0,stone,false);
const landmarks=[{name:'Tempat Wuduk',x:-14,z:-10,c:0x75cfe3},{name:'Perpustakaan',x:13,z:-10,c:0xf6bf72},{name:'Surau',x:0,z:17,c:0x85cbb5}];
function label(text,x,y,z){const c=document.createElement('canvas');c.width=512;c.height=90;const ctx=c.getContext('2d');ctx.fillStyle='#163b55';ctx.roundRect(5,5,502,78,20);ctx.fill();ctx.fillStyle='white';ctx.font='bold 34px sans-serif';ctx.textAlign='center';ctx.fillText(text,256,56);const tex=new THREE.CanvasTexture(c);const mesh=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));mesh.position.set(x,y,z);mesh.scale.set(7,1.23,1);scene.add(mesh)}
for(const l of landmarks){cube(10,4,7,l.x,2,l.z,mat(l.c));cube(11,.7,8,l.x,4.35,l.z,dark);cube(2.3,3,.2,l.x,1.5,l.z+3.57,mat(0x6c4833));for(let i of [-3.5,3.5])cube(1.8,1.4,.23,l.x+i,2.3,l.z+3.65,mat(0xbceeff));label(l.name,l.x,6,l.z)}
for(let i=0;i<20;i++){let x=-27+(i*13)%54,z=-26+(i*19)%52;if(Math.abs(x)<7||landmarks.some(l=>Math.hypot(l.x-x,l.z-z)<9))continue;cylinder(.45,2.2,x,1.1,z,mat(0x815e3d));ball(2.1,x,3.1,z,mat(0x388e55))}
// Watak kartun dibina daripada bentuk geometri 3D
function character(x,z,shirt,hat=false){const g=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.9,1.15,.52),mat(shirt));body.position.y=1.25;g.add(body);const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),skin);head.position.y=2.1;g.add(head);const hair=new THREE.Mesh(new THREE.SphereGeometry(.43,16,12),black);hair.scale.y=.35;hair.position.y=2.43;g.add(hair);if(hat){const cap=new THREE.Mesh(new THREE.CylinderGeometry(.44,.44,.3,16),white);cap.position.y=2.52;g.add(cap)}const legs=[];for(let s of [-1,1]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.29,.72,.35),blue);leg.position.set(s*.24,.37,0);g.add(leg);legs.push(leg);const arm=new THREE.Mesh(new THREE.BoxGeometry(.23,.85,.28),shirt===0xffffff?white:mat(shirt));arm.position.set(s*.63,1.25,0);g.add(arm)}g.position.set(x,0,z);scene.add(g);return {g,legs}}
const amir=character(0,-20,0xffffff);const teacher=character(13,-5,0x3aa486,true);label('Ustaz Hakim',13,3.5,-5);const guard=character(-14,-5,0xf8e09b);label('Pengawas',-14,3.5,-5);
const keys=new Set();let active=false,mission=0,score=0,answered=0;const modal=document.getElementById('modal'),dialog=document.getElementById('dialog'),hint=document.getElementById('hint');const targets=[{x:-14,z:-5,r:4},{x:13,z:-5,r:4},{x:0,z:21,r:5}];
const quizzes=[[
['Apakah maksud tayammum?',['Membasuh anggota dengan air','Menyapu muka dan kedua-dua tangan dengan debu tanah yang suci berserta niat','Membersihkan pakaian'],1,'Tayammum ialah bersuci menggunakan debu tanah yang suci sebagai ganti wuduk atau mandi wajib dalam keadaan yang diharuskan.'],
['Antara berikut, bilakah tayammum diharuskan?',['Apabila air tiada setelah berusaha mencarinya','Apabila malas mengambil wuduk','Apabila mahu cepat'],0,'Ketiadaan air selepas berusaha mencarinya merupakan antara sebab yang mengharuskan tayammum.']],[
['Apakah bahan yang digunakan untuk tayammum?',['Pasir basah bercampur najis','Debu tanah yang suci','Air sabun'],1,'Gunakan debu tanah yang suci dan memenuhi syarat tayammum.'],
['Siapakah yang boleh bertayammum kerana sakit?',['Orang yang penggunaan air boleh memudaratkannya','Sesiapa yang tidak suka air','Sesiapa yang mahu berehat'],0,'Penggunaan air yang boleh memudaratkan kesihatan merupakan keuzuran yang membolehkan tayammum.']],[
['Apakah anggota yang disapu ketika tayammum?',['Muka dan kedua-dua tangan hingga siku','Kaki sahaja','Kepala dan telinga sahaja'],0,'Menurut panduan mazhab Syafie, sapu muka dan kedua-dua tangan hingga siku.'],
['Apakah urutan rukun tayammum yang betul?',['Niat, sapu muka, sapu kedua-dua tangan hingga siku, tertib','Sapu kaki, niat, basuh muka','Basuh tangan dengan air, sapu kepala'],0,'Rukun tayammum: niat, menyapu muka, menyapu kedua-dua tangan hingga siku, dan tertib.'],
['Apakah yang perlu dilakukan sebelum tayammum jika air tiada?',['Berusaha mencari air dahulu','Terus abaikan solat','Gunakan debu yang bernajis'],0,'Pastikan sebab yang mengharuskan tayammum benar-benar wujud.']]];
const titles=['Misi 1: Misteri Bekalan Air','Misi 2: Rahsia Debu Suci','Misi 3: Cabaran Surau'];const objectives=['Jumpa pengawas di tempat wuduk','Jumpa Ustaz Hakim di perpustakaan','Pergi ke surau untuk cabaran terakhir'];
function show(html){dialog.innerHTML=html;modal.classList.remove('hidden');active=false}function close(){modal.classList.add('hidden');active=true}function update(){document.getElementById('score').textContent=score;document.getElementById('progress').textContent=`${mission}/3 misi`;document.getElementById('objective').textContent=objectives[mission]||'Semua misi selesai!'}
function ask(){const q=quizzes[mission][answered];show(`<span class="tag">${titles[mission]} • Soalan ${answered+1}/${quizzes[mission].length}</span><h2>${q[0]}</h2><div class="answers">${q[1].map((v,i)=>`<button data-answer="${i}">${String.fromCharCode(65+i)}. ${v}</button>`).join('')}</div><p class="status" id="feedback"></p>`);dialog.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const choice=Number(b.dataset.answer),correct=choice===q[2];if(correct){score+=10;answered++;update()}dialog.innerHTML=`<h2>${correct?'✅ Jawapan betul!':'💡 Cuba lagi'}</h2><p>${q[3]}</p><p>${correct?'+10 markah':'Tiada markah ditolak.'}</p><button class="primary" id="next">${correct?'Teruskan':'Cuba semula'}</button>`;document.getElementById('next').onclick=()=>{if(!correct){ask();return}if(answered<quizzes[mission].length){ask();return}mission++;answered=0;update();if(mission===3){show(`<h1>🏆 TAHNIAH, WIRA TAYAMMUM!</h1><p>Amir berjaya menyelesaikan misteri sekolah dan mempelajari ilmu tayammum.</p><h2>⭐ Markah: ${score}/70</h2><p>Semua 3 misi selesai!</p><button class="primary" onclick="location.reload()">Main semula</button>`)}else{show(`<h2>🎉 Misi berjaya!</h2><p>Kamu telah membuka ${titles[mission]}.</p><p>Petunjuk baharu: ${objectives[mission]}.</p><button class="primary" id="go">Teruskan pengembaraan</button>`);document.getElementById('go').onclick=close}}}})}
function interact(){if(!active||mission>=3)return;const t=targets[mission];if(Math.hypot(amir.g.position.x-t.x,amir.g.position.z-t.z)<t.r+1){show(`<h2>💬 ${mission===0?'Pengawas Sekolah':mission===1?'Ustaz Hakim':'Cabaran Surau'}</h2><p>${['Bekalan air sekolah terganggu. Mari kita fahami bilakah tayammum dibenarkan.','Amir, cari ilmu tentang debu tanah yang suci dan keadaan yang mengharuskan tayammum.','Hebat! Susun pengetahuan kamu tentang rukun dan cara tayammum.'][mission]}</p><button class="primary" id="startq">Mulakan kuiz</button>`);document.getElementById('startq').onclick=ask}}
document.getElementById('action').onclick=interact;addEventListener('keydown',e=>{if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys.add(e.key.toLowerCase());if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key.toLowerCase();b.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(k);b.setPointerCapture(e.pointerId)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(k))});
show(`<span class="tag">Pendidikan Islam • Tahun 5</span><h1>🏫 Misteri Tayammum 3D</h1><p>Amir mendapati bekalan air sekolah terganggu. Terokai sekolah 3D, berjumpa dengan watak dan jawab kuiz untuk menyelesaikan misteri!</p><p><b>Kawalan:</b> WASD / anak panah untuk bergerak, E atau butang AKSI untuk berinteraksi.</p><button class="primary" id="begin">MULA BERMAIN ▶</button>`);document.getElementById('begin').onclick=close;
const clock=new THREE.Clock();function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(active){let dx=0,dz=0;if(keys.has('w')||keys.has('arrowup'))dz-=1;if(keys.has('s')||keys.has('arrowdown'))dz+=1;if(keys.has('a')||keys.has('arrowleft'))dx-=1;if(keys.has('d')||keys.has('arrowright'))dx+=1;const length=Math.hypot(dx,dz);if(length){dx/=length;dz/=length;let nx=THREE.MathUtils.clamp(amir.g.position.x+dx*8*dt,-28,28),nz=THREE.MathUtils.clamp(amir.g.position.z+dz*8*dt,-28,28);const blocked=landmarks.some(l=>Math.abs(nx-l.x)<5.6&&Math.abs(nz-l.z)<3.9);if(!blocked){amir.g.position.x=nx;amir.g.position.z=nz}amir.g.rotation.y=Math.atan2(dx,dz);amir.legs.forEach((leg,i)=>leg.rotation.x=Math.sin(performance.now()*.012+i*Math.PI)*.5)}else amir.legs.forEach(l=>l.rotation.x=0)}const t=targets[Math.min(mission,2)];const dist=Math.hypot(amir.g.position.x-t.x,amir.g.position.z-t.z);hint.textContent=mission>=3?'🏆 Semua misi selesai':dist<t.r+1?'Tekan E / AKSI untuk berinteraksi ✨':`📍 ${objectives[mission]}`;camera.position.lerp(new THREE.Vector3(amir.g.position.x+12,17,amir.g.position.z+20),.06);camera.lookAt(amir.g.position.x,0,amir.g.position.z);renderer.render(scene,camera);drawMap()}function drawMap(){const c=document.getElementById('map'),ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);ctx.fillStyle='#d6efdf';ctx.fillRect(0,0,150,120);for(let i=0;i<3;i++){const l=landmarks[i];ctx.fillStyle=i===mission?'#f59e0b':'#638fa5';ctx.fillRect((l.x+30)*2.5-7,(l.z+30)*2-6,14,12)}ctx.fillStyle='#ec407a';ctx.beginPath();ctx.arc((amir.g.position.x+30)*2.5,(amir.g.position.z+30)*2,5,0,Math.PI*2);ctx.fill()}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});update();animate();
</script></body></html>
